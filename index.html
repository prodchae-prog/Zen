ter; justify-content: center\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><rect x=\"2\" y=\"2\" width=\"12\" height=\"12\" rx=\"2\" fill=\"currentColor\"><\/rect><\/svg><\/button>\n<button type=\"button\" onClick=\"{{ playPause }}\" aria-label=\"{{ playLabel }}\" style=\"min-width: 150px; height: 64px; padding: 0 26px; border-radius: 999px; border: 0; background: var(--accent, #DCE98C); color: var(--text, #1C2520); font: 600 16px 'Manrope', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 10px 26px rgba(0,0,0,0.25)\">\n<sc-if value=\"{{ isPlaying }}\" hint-placeholder-val=\"{{ false }}\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><rect x=\"3\" y=\"2\" width=\"3.5\" height=\"12\" rx=\"1\" fill=\"currentColor\"><\/rect><rect x=\"9.5\" y=\"2\" width=\"3.5\" height=\"12\" rx=\"1\" fill=\"currentColor\"><\/rect><\/svg><\/sc-if>\n<sc-if value=\"{{ notPlaying }}\" hint-placeholder-val=\"{{ true }}\"><svg aria-hidden=\"true\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\"><path d=\"M4 2.5v11l9.5-5.5z\" fill=\"currentColor\"><\/path><\/svg><\/sc-if>\n{{ playLabel }}<\/button>\n<button type=\"button\" onClick=\"{{ toggleVoice }}\" aria-pressed=\"{{ voicePressed }}\" aria-label=\"Voz guiada\" style=\"{{ voiceBtn }}\"><svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\"><path d=\"M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z M5 11a7 7 0 0 0 14 0 M12 18v3\"><\/path><\/svg><\/button>\n<\/div>\n<div style=\"display: flex; gap: 8px\">\n<button type=\"button\" onClick=\"{{ toggleAmb }}\" aria-pressed=\"{{ ambPressed }}\" style=\"{{ ambBtn }}\">Sonido ambiente<\/button>\n<\/div>\n<sc-if value=\"{{ finished }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin: 0; padding: 12px 16px; border-radius: 18px; background: rgba(255,255,255,0.12); font-weight: 300; font-size: 18px; text-align: center; animation: fadeUp .8s ease both\">“Me he regalado este momento. Me lo merezco.”<\/p>\n<\/sc-if>\n<\/section>\n\n<section style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-size: 15px; font-weight: 600\">Elige tu meditación<\/h2>\n<sc-for list=\"{{ list }}\" as=\"m\" hint-placeholder-count=\"6\">\n<button type=\"button\" onClick=\"{{ m.pick }}\" aria-pressed=\"{{ m.pressed }}\" style=\"{{ m.style }}\">\n<span style=\"{{ m.dot }}\"><\/span>\n<span style=\"flex: 1; display: flex; flex-direction: column; gap: 2px; text-align: left\"><span style=\"font-size: 15px; font-weight: 600; color: var(--text, #1C2520)\">{{ m.title }}<\/span><span style=\"font-size: 12px; color: #55625A\">{{ m.desc }}<\/span><\/span>\n<span style=\"font-size: 12px; font-family: 'DM Mono', monospace; color: #55625A\">{{ m.len }}<\/span>\n<\/button>\n<\/sc-for>\n<\/section>\n<p style=\"margin: 0; font-size: 12px; color: #55625A; text-align: center; line-height: 1.45\">En esta maqueta la voz la genera tu dispositivo. En la app final irá una voz grabada en estudio.<\/p>\n<\/div>\n<div style=\"height: 72px; flex-shrink: 0\"><dc-import name=\"Nav\" active=\"inicio\" hint-size=\"390px,72px\"><\/dc-import><\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  themeRead() {\n    let id = null;\n    try { id = window.localStorage.getItem('imagenPalette'); } catch (e) {}\n    if (!id) { try { id = window.__imagenPalette; } catch (e) {} }\n    return id || 'salvia';\n  }\n  themeSub() {\n    this._themeFn = () => this.forceUpdate();\n    try { window.addEventListener('storage', this._themeFn); window.addEventListener('imagen-palette', this._themeFn); } catch (e) {}\n  }\n  themeUnsub() {\n    try { window.removeEventListener('storage', this._themeFn); window.removeEventListener('imagen-palette', this._themeFn); } catch (e) {}\n  }\n  themeVars() {\n    const S = { m: '#8FAE8B', h0: '#5E7F64' };\n    const P = {\n      salvia: S,\n      arena: { m: '#C2A07A', h0: '#B08E66' },\n      niebla: { m: '#8FA9C0', h0: '#7F9DB8' },\n      cuarzo: { m: '#D9A3A8', h0: '#C99893', dark: ['#6B4A3A', '#3A2820'], n: '58,40,32', ink: '#4A3226', text: '#3A2820', panel: 'linear-gradient(170deg, #4A3226 0%, #2A1C16 100%)' },\n      lavanda: { m: '#A597C4', h0: '#9A8BBE' }\n    };\n    const p = P[this.themeRead()] || S;\n    const d = p.dark || ['#3E5B4A', '#1F2E26'];\n    return '--accent: #DCE98C; --accent-soft: #E4ECC0; --mid: ' + p.m + '; --deep: ' + d[0] +\n      '; --nav-rgb: ' + (p.n || '28,37,32') + '; --nav: rgba(' + (p.n || '28,37,32') + ',0.9)' +\n      '; --ink: ' + (p.ink || '#22302A') + '; --text: ' + (p.text || '#1C2520') +\n      (p.panel ? '; --panel: ' + p.panel : '') +\n      '; --hero: linear-gradient(155deg, ' + p.h0 + ' 0%, ' + d[0] + ' 55%, ' + d[1] + ' 100%)' +\n      '; --bg: radial-gradient(130% 55% at 50% -8%, #C6D6C0 0%, rgba(255,255,255,0) 62%), radial-gradient(90% 40% at 100% 100%, #E3E9D2 0%, rgba(255,255,255,0) 70%), linear-gradient(180deg, #F3F4EF 0%, #E8EDE6 100%)';\n  }\n  componentDidMount() { this.themeSub(); if (this._didMount) this._didMount(); }\n  componentWillUnmount() { this.themeUnsub(); if (this._willUnmount) this._willUnmount(); }\n  renderVals() { return Object.assign({}, this._renderVals(), { themeVars: this.themeVars() }); }\n\n  constructor(props) {\n    super(props);\n    const L = (t, s) => ({ t, s });\n    this.meds = [\n      { title: 'Calma en 3 minutos', desc: 'Para un momento de estrés', dur: 180, lines: [L(0, 'Bienvenida. Busca una postura cómoda y cierra los ojos si te apetece.'), L(10, 'Inhala despacio por la nariz, y suelta el aire por la boca.'), L(25, 'Nota el peso de tu cuerpo. No tienes que hacer nada más.'), L(50, 'Cada vez que exhalas, sueltas un poco más de tensión.'), L(80, 'Si aparece un pensamiento, déjalo pasar como una nube.'), L(120, 'Vuelve a tu respiración. Tranquila. Constante.'), L(160, 'Poco a poco, vuelve al lugar donde estás.'), L(175, 'Abre los ojos cuando quieras. Lo has hecho muy bien.')] },\n      { title: 'Gratitud', desc: 'Para empezar o cerrar el día', dur: 300, lines: [L(0, 'Bienvenida. Respira hondo y deja que tu cuerpo se relaje.'), L(20, 'Piensa en algo pequeño de hoy que te haya hecho sonreír.'), L(60, 'Quédate con esa sensación. Deja que llene tu pecho.'), L(100, 'Ahora piensa en una persona por la que te sientes agradecida.'), L(150, 'Envíale, en silencio, un gracias.'), L(200, 'Y por último, agradece algo de tu cuerpo. Todo lo que hace por ti.'), L(260, 'Guarda esta calidez contigo.'), L(290, 'Cuando estés lista, abre los ojos.')] },\n      { title: 'Energía para la mañana', desc: 'Despierta con una intención', dur: 240, lines: [L(0, 'Buenos días. Siéntate con la espalda recta y los hombros relajados.'), L(15, 'Inhala en cuatro tiempos, y exhala en cuatro.'), L(45, 'Imagina una luz cálida que entra con cada respiración.'), L(90, 'Esa luz despierta tu cara, tus hombros, tu espalda.'), L(140, 'Piensa en una intención para hoy. Solo una.'), L(190, 'Repítela en silencio tres veces.'), L(230, 'Abre los ojos. Hoy eliges cuidarte.')] },\n      { title: 'Antes de dormir', desc: 'Suelta el día y descansa', dur: 360, lines: [L(0, 'Túmbate y deja que la cama te sostenga.'), L(20, 'Respira lento. Cada exhalación, un poco más larga que la anterior.'), L(70, 'Relaja la frente, el entrecejo, la mandíbula.'), L(120, 'Suelta los hombros. Deja caer los brazos.'), L(180, 'Relaja el vientre, las caderas, las piernas.'), L(250, 'Todo lo de hoy ya pasó. Ahora solo descansas.'), L(330, 'Sigue respirando así, despacio, hasta quedarte dormida.')] },\n      { title: 'Escaneo corporal', desc: 'Recorre tu cuerpo con calma', dur: 480, lines: [L(0, 'Siéntate o túmbate. Vamos a recorrer tu cuerpo con calma.'), L(30, 'Empieza por los pies. Nota cómo están, sin cambiar nada.'), L(90, 'Sube a las piernas y las rodillas. Suelta la tensión.'), L(150, 'Ahora la cadera y la parte baja de la espalda.'), L(210, 'El pecho y el vientre suben y bajan con tu respiración.'), L(270, 'Los hombros, los brazos, las manos. Pesados y relajados.'), L(340, 'El cuello, la cara, la cabeza. Todo suave.'), L(420, 'Siente tu cuerpo entero, presente, aquí.'), L(470, 'Cuando quieras, mueve despacio los dedos y abre los ojos.')] },\n      { title: 'Confianza', desc: 'Para verte con buenos ojos', dur: 300, lines: [L(0, 'Siéntate erguida, con el pecho abierto.'), L(20, 'Respira hondo y repite en silencio: estoy aprendiendo a quererme.'), L(80, 'Recuerda un momento en el que te sentiste orgullosa de ti.'), L(140, 'Nota dónde sientes ese orgullo en tu cuerpo.'), L(200, 'Repite: merezco cuidarme. Merezco sentirme bien.'), L(270, 'Llévate esta sensación contigo. Abre los ojos.')] }\n    ];\n    this.state = { sel: 0, status: 'idle', elapsed: 0, said: -1, voice: true, amb: true, finished: false, line: '' };\n  }\n  _didMount() {\n    this.timer = setInterval(() => {\n      if (this.state.status !== 'playing') return;\n      const m = this.meds[this.state.sel];\n      const e = this.state.elapsed + 1;\n      let said = this.state.said, line = this.state.line;\n      for (let i = said + 1; i < m.lines.length && m.lines[i].t <= e; i++) { said = i; line = m.lines[i].s; this.say(line); }\n      if (e >= m.dur) { this.finish(); return; }\n      this.setState({ elapsed: e, said, line });\n    }, 1000);\n  }\n  _willUnmount() { clearInterval(this.timer); this.hardStop(); }\n  say(text) {\n    if (!this.state.voice) return;\n    try {\n      const u = new SpeechSynthesisUtterance(text);\n      u.lang = 'es-ES'; u.rate = 0.82; u.pitch = 1;\n      const v = window.speechSynthesis.getVoices().find((x) => x.lang && x.lang.indexOf('es') === 0);\n      if (v) u.voice = v;\n      window.speechSynthesis.speak(u);\n    } catch (e) {}\n  }\n  ambStart(force) {\n    if (!force && !this.state.amb) return;\n    try {\n      const A = window.AudioContext || window.webkitAudioContext;\n      if (!this.ctx) this.ctx = new A();\n      const c = this.ctx;\n      if (c.state === 'suspended') c.resume();\n      if (this.nodes) return;\n      const master = c.createGain(); master.gain.setValueAtTime(0.0001, c.currentTime); master.gain.exponentialRampToValueAtTime(0.05, c.currentTime + 3);\n      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;\n      const lfo = c.createOscillator(), lfoG = c.createGain(); lfo.frequency.value = 0.08; lfoG.gain.value = 0.015;\n      lfo.connect(lfoG); lfoG.connect(master.gain);\n      const oscs = [110, 164.81, 220.5, 329.63].map((fr, i) => { const o = c.createOscillator(); o.type = i % 2 ? 'triangle' : 'sine'; o.frequency.value = fr; o.detune.value = (i - 1.5) * 4; o.connect(f); o.start(); return o; });\n      f.connect(master); master.connect(c.destination); lfo.start();\n      this.nodes = { oscs, lfo, master };\n    } catch (e) {}\n  }\n  ambStop() {\n    try {\n      if (this.nodes) { const t = this.ctx.currentTime; this.nodes.master.gain.cancelScheduledValues(t); this.nodes.master.gain.setTargetAtTime(0.0001, t, 0.4); const n = this.nodes; setTimeout(() => { n.oscs.forEach((o) => o.stop()); n.lfo.stop(); }, 1500); this.nodes = null; }\n    } catch (e) {}\n  }\n  hardStop() { try { window.speechSynthesis.cancel(); } catch (e) {} this.ambStop(); }\n  finish() { this.hardStop(); this.setState({ status: 'idle', elapsed: 0, said: -1, finished: true, line: '' }); }\n  fmt(s) { return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }\n  _renderVals() {\n    const st = this.state;\n    const m = this.meds[st.sel];\n    const playing = st.status === 'playing';\n    const paused = st.status === 'paused';\n    const orbBase = 'position: absolute; animation-play-state: ' + (playing ? 'running' : 'paused') + '; ';\n    const list = this.meds.map((x, i) => {\n      const on = st.sel === i;\n      return {\n        title: x.title, desc: x.desc, len: this.fmt(x.dur),\n        pressed: on ? 'true' : 'false',\n        pick: () => { this.hardStop(); this.setState({ sel: i, status: 'idle', elapsed: 0, said: -1, finished: false, line: '' }); },\n        style: 'display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 10px 14px; border-radius: 20px; cursor: pointer; font-family: Manrope, sans-serif; backdrop-filter: blur(18px); background: ' + (on ? 'rgba(255,255,255,0.8)' : 'rgba(255,255,255,0.5)') + '; border: ' + (on ? '2px solid var(--ink, #22302A)' : '1px solid rgba(255,255,255,0.8)'),\n        dot: 'width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; background: ' + (on ? 'var(--accent, #DCE98C)' : '#C8D3C6') + (on ? '; box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent, #DCE98C) 35%, transparent)' : '')\n      };\n    });\n    const tog = (on) => 'min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; font: 500 13px Manrope, sans-serif; border: 1px solid rgba(244,246,241,0.5); background: ' + (on ? 'rgba(244,246,241,0.18)' : 'transparent') + '; color: #F4F6F1';\n    return {\n      cur: m,\n      list,\n      isPlaying: playing, notPlaying: !playing,\n      playLabel: playing ? 'Pausa' : (paused ? 'Seguir' : 'Iniciar'),\n      statusTag: playing ? 'REPRODUCIENDO' : (paused ? 'EN PAUSA' : (st.finished ? 'COMPLETADA' : 'LISTA PARA EMPEZAR')),\n      subtitle: st.line || (st.finished ? 'Sesión completada.' : m.desc + '. Ponte cómoda y pulsa Iniciar.'),\n      elapsedText: this.fmt(st.elapsed), totalText: this.fmt(m.dur),\n      barStyle: 'height: 100%; background: var(--accent, #DCE98C); transition: width 1s linear; width: ' + ((st.elapsed / m.dur) * 100).toFixed(2) + '%',\n      orbA: orbBase + 'inset: 0; background: radial-gradient(circle at 35% 32%, #F7FAE6 0%, var(--accent, #DCE98C) 28%, var(--mid, #8FAE8B) 62%, var(--deep, #4E6E57) 100%); box-shadow: 0 0 50px color-mix(in srgb, var(--accent, #DCE98C) 45%, transpare tas, con el pelo ya seco.<\/li>\n<li><strong>Día 2:<\/strong> champú seco en raíz por la noche y peinado recogido suave.<\/li>\n<\/ol>\n<div style=\"background: rgba(255,255,255,0.55); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 13px; font-weight: 600\">Evita<\/p>\n<p style=\"margin: 0; font-size: 13px; color: #55625A; line-height: 1.45\">Tocarte el pelo a menudo · agua muy caliente · plancha sin protector · mascarillas en la raíz.<\/p>\n<\/div>\n<\/section>\n<\/div>\n\n<div style=\"height: 72px; flex-shrink: 0\"><dc-import name=\"Nav\" active=\"rostro\" hint-size=\"390px,72px\"><\/dc-import><\/div>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  themeRead() {\n    let id = null;\n    try { id = window.localStorage.getItem('imagenPalette'); } catch (e) {}\n    if (!id) { try { id = window.__imagenPalette; } catch (e) {} }\n    return id || 'salvia';\n  }\n  themeSub() {\n    this._themeFn = () => this.forceUpdate();\n    try { window.addEventListener('storage', this._themeFn); window.addEventListener('imagen-palette', this._themeFn); } catch (e) {}\n  }\n  themeUnsub() {\n    try { window.removeEventListener('storage', this._themeFn); window.removeEventListener('imagen-palette', this._themeFn); } catch (e) {}\n  }\n  themeVars() {\n    const S = { m: '#8FAE8B', h0: '#5E7F64' };\n    const P = {\n      salvia: S,\n      arena: { m: '#C2A07A', h0: '#B08E66' },\n      niebla: { m: '#8FA9C0', h0: '#7F9DB8' },\n      cuarzo: { m: '#D9A3A8', h0: '#C99893', dark: ['#6B4A3A', '#3A2820'], n: '58,40,32', ink: '#4A3226', text: '#3A2820', panel: 'linear-gradient(170deg, #4A3226 0%, #2A1C16 100%)' },\n      lavanda: { m: '#A597C4', h0: '#9A8BBE' }\n    };\n    const p = P[this.themeRead()] || S;\n    const d = p.dark || ['#3E5B4A', '#1F2E26'];\n    return '--accent: #DCE98C; --accent-soft ,255,0.52); border: 1px solid rgba(255,255,255,0.8); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(34,48,42,0.07); border-radius: 28px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; color: var(--ink, #22302A); font-family: 'DM Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase\">Tu ceja ideal<\/p>\n<h3 style=\"margin: 0; font-weight: 300; font-size: 26px; letter-spacing: -0.01em\">{{ cur.brow }}<\/h3>\n<p style=\"margin: 0; font-size: 14px; color: #55625A; line-height: 1.5\">{{ cur.why }}<\/p>\n<\/section>\n\n<section style=\"background: rgba(255,255,255,0.52); border: 1px solid rgba(255,255,255,0.8); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(34,48,42,0.07); border-radius: 28px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; color: var(--ink, #22302A); font-family: 'DM Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase\">Cuidado<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.5\">Péinalas hacia arriba con gel fijador · quita solo los pelos sueltos de debajo, nunca por encima del arco · rellena huecos con trazos finos, como pelitos · si están despobladas, un sérum de crecimiento y paciencia.<\/p>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 12px; font-weight: 600; color: var(--ink, #22302A); font-family: 'DM Mono', monospace; letter-spacing: 0.1em; text-transform: uppercase\">Color<\/p>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.5\">Un tono más claro que tu pelo si eres morena; uno más oscuro si eres rubia.<\/p>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<p style=\"margin: 0; font-size: 12px; transform:translateY(-20px) scale(.9)}100%{opacity:1;transform:none}}\n@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.35}}\n@media (prefers-reduced-motion: reduce){*{animation:none!important}}\n<\/style>\n<\/helmet>\n<sc-if value=\"{{ show }}\" hint-placeholder-val=\"{{ true }}\">\n<a href=\"GuaSha.dc.html\" aria-label=\"{{ aria }}\" style=\"pointer-events: auto; display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 14px; border-radius: 999px; text-decoration: none; color: #F4F6F1; font-family: 'Manrope', sans-serif; background: rgba(var(--nav-rgb, 28,37,32), 0.72); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); border: 1px solid rgba(255,255,255,0.28); box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 10px 26px rgba(20,28,24,0.3); animation: pillDrop .5s cubic-bezier(.2,.9,.3,1.15) both\">\n<span style=\"{{ dot }}\"><\/span>\n<span style=\"font-size: 13px; font-weight: 500; white-space: nowrap\">{{ label }}<\/span>\n<span style=\"min-width: 58px; height: 32px; padding: 0 10px; border-radius: 999px; background: var(--accent, #DCE98C); color: var(--text, #1C2520); display: flex; align-items: center; justify-content: center; font: 500 14px 'DM Mono', monospace; font-variant-numeric: tabular-nums\">{{ clock }}<\/span>\n<\/a>\n<\/sc-if>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"demo\":{\"editor\":\"boolean\",\"default\":false},\"$preview\":{\"width\":260,\"height\":44}}'>\nclass Component extends DCLogic {\n  componentDidMount() { this.t = setInterval(() => this.forceUpdate(), 1000); }\n  componentWillUnmount() { clearInterval(this.t); }\n  read() {\n    try { if (window.__zenTimer) return window.__zenTimer; } catch (e) {}\n    try { return JSON.parse(window.localStorage.getItem('zenTimer') || 'null'); } catch (e) { return null; }\n  }\n  renderVals() {\n    let s = this.read();\n    if (!s && this.props.demo) s = { active: true, pinned: true, running: true, zone: 'Mandíbula', endAt: Date.now() + 42000 };\n    if (!s || !s.active || !s.pinned) return { show: false, label: '', clock: '', dot: '', aria: '' };\n    const left = s.running ? Math.max(0, Math.ceil((s.endAt - Date.now()) / 1000)) : (s.left || 0);\n    const ended = s.running && left === 0;\n    const clock = ended ? 'Seguir' : Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');\n    const label = ended ? 'Zona terminada' : (s.running ? 'Gua sha · ' + s.zone : 'En pausa · ' + s.zone);\n    return {\n      show: true,\n      label, clock,\n      aria: label + ', ' + clock + '. Toca para volver al gua sha',\n      dot: 'width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: ' + (s.running && !ended ? 'var(--accent, #DCE98C)' : '#B9C4B6') + (s.running && !ended ? '; animation: livePulse 1.6s ease-in-out infinite' : '')\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n"}</script>
<script>
{
const Z = () => window.ZEN;
const EXT = window.ZENEXT = {};
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* Inicio: fecha y saludo reales */
EXT.Main = {
  vals() {
    const d = new Date();
    let today = '';
    try { today = d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }).replace(',', ' ·'); } catch (e) {}
    const h = d.getHours();
    const hi = h < 14 ? 'Buenos días' : h < 21 ? 'Buenas tardes' : 'Buenas noches';
    const n = Z().name();
    return { todayText: cap(today), greetText: n ? hi + ', ' + n : hi };
  }
};

/* Registro de actividad */
EXT.GuaSha = { after(i) {
  if (i.state.done && !i.__logged) { i.__logged = true; Z().log('guasha', 5, 'Gua sha · 5 zonas'); }
  if (!i.state.done) i.__logged = false;
} };
EXT.Espalda = { after(i) {
  const all = Object.values(i.state.done || {}).filter(Boolean).length >= 6;
  const t = Z().today();
  if (all && !Z().logs().some((l) => l.d === t && l.type === 'espalda')) Z().log('espalda', 20, 'Rutina de espalda');
} };
EXT.Meditacion = { after(i) {
  if (i.state.finished && !i.__logged) { i.__logged = true; const m = i.meds[i.state.sel]; Z().log('meditacion', Math.round(m.dur / 60), 'Meditación · ' + m.title); }
  if (!i.state.finished) i.__logged = false;
} };
EXT.Bienvenida2 = { after(i) { if (i.state.name && i.state.name.trim()) Z().set('zenName', i.state.name.trim()); } };

/* Progreso con datos reales */
function weekData() {
  const days = Z().week(), L = Z().logs();
  const sum = (type) => days.map((d) => L.filter((l) => l.d === d && (!type || l.type === type)).reduce((a, l) => a + (l.min || 0), 0));
  return { todo: sum(null), guasha: sum('guasha'), espalda: sum('espalda') };
}
function streak() {
  const L = Z().logs(); const set = new Set(L.filter((l) => l.min > 0).map((l) => l.d));
  let n = 0; const d = new Date();
  if (!set.has(Z().today(d))) d.setDate(d.getDate() - 1);
  while (set.has(Z().today(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
EXT.Progreso = {
  init(i) { i.data = weekData(); },
  vals(i) {
    const L = Z().logs();
    const t = Z().today();
    const dismissed = Z().get('zenSuggestOff', '') === t;
    const dow = (new Date().getDay() + 6) % 7;
    const expected = [0, 2, 4].filter((x) => x < dow).length;
    const done = i.data.espalda.filter((v) => v > 0).length;
    let text, yes = false;
    if (!L.length) text = 'Cuando completes tu primer gua sha, rutina de espalda o meditación, aquí verás cómo te va y te sugeriré ajustes.';
    else if (done < expected) { text = 'Esta semana llevas ' + done + ' de ' + expected + ' rutinas de espalda. ¿Te apunto una para mañana a las 19:00 en tus notas?'; yes = true; }
    else text = 'Vas muy bien esta semana. Mantén el ritmo con calma, sin exigirte de más.';
    return {
      streakText: String(streak()),
      showSuggest: !dismissed, suggestText: text, showYes: yes,
      suggestYesLabel: 'Sí, apúntala',
      suggestNoLabel: yes ? 'Ahora no' : 'Vale',
      suggestYes: () => {
        const notes = Z().get('zenNotas', []);
        notes.push({ id: Date.now(), text: 'Rutina de espalda · 20 min', time: '19:00', done: false });
        Z().set('zenNotas', notes); Z().set('zenSuggestOff', t); i.forceUpdate();
      },
      suggestNo: () => { Z().set('zenSuggestOff', t); i.forceUpdate(); }
    };
  }
};

/* Historial: fotos reales y registro */
const photoBg = (src) => "background: center / cover no-repeat url('" + src + "')";
EXT.Historial = {
  init(i) {
    i.photos = [];
    window.ZENDB.all().then((p) => { i.photos = p; i.forceUpdate(); });
    const L = Z().logs().slice().reverse();
    const nEsp = L.filter((l) => l.type === 'espalda').length, nGs = L.filter((l) => l.type === 'guasha').length;
    try {
      const c = i.zoneData.cuerpo;
      c[0].tag = nGs + ' sesiones'; c[2].tag = nEsp + ' rutinas';
      c[2].note = nEsp ? 'Has completado ' + nEsp + ' rutinas de espalda. Compara tus fotos de espalda para ver el cambio.' : 'Aún no has completado ninguna rutina de espalda. ¡La primera cuenta!';
      c[0].note = nGs ? 'Llevas ' + nGs + ' sesiones de gua sha. Compara tus fotos de cara en la vista Cara.' : 'Cuando hagas tu primer gua sha, aparecerá aquí.';
    } catch (e) {}
    const log = L.slice(0, 8).map((l) => ({ what: l.what, when: Z().fmtDate(l.t) + (l.min ? ' · ' + l.min + ' min' : '') }));
    i.log = log.length ? log : [{ what: 'Aún no hay actividad', when: 'Empieza hoy con algo pequeño' }];
  },
  vals(i) {
    const P = i.photos || [];
    const first = P[0], last = P.length > 1 ? P[P.length - 1] : null;
    const cur = P.find((p) => p.id === i.state.zPhoto);
    const reload = () => window.ZENDB.all().then((p) => { i.photos = p; i.forceUpdate(); });
    return {
      photos: P.slice().reverse().map((p) => ({
        label: Z().fmtDate(p.t),
        open: () => i.setState({ zPhoto: p.id, zDel: false }),
        style: 'height: 110px; border-radius: 22px; border: 0; padding: 8px; cursor: pointer; display: flex; align-items: flex-end; justify-content: flex-start; ' + photoBg(p.src)
      })),
      photoHint: P.length ? P.length + ' fotos · misma luz y distancia para comparar' : 'Haz tu primera foto: de frente, con luz natural.',
      beforeBg: first ? photoBg(first.src) : 'background: rgba(214,224,210,0.7)',
      afterBg: last ? photoBg(last.src) : 'background: rgba(214,224,210,0.7)',
      beforeLabel: first ? Z().fmtDate(first.t) : 'Sin foto aún',
      afterLabel: last ? Z().fmtDate(last.t) : 'Sin foto aún',
      addPhoto: () => { if (i.__file) i.__file.click(); },
      setFile: (el) => { i.__file = el; },
      onFile: (e) => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        window.ZENSHRINK(f, 1100).then((src) => window.ZENDB.put({ id: Date.now(), t: Date.now(), src })).then(() => { Z().log('foto', 0, 'Foto de seguimiento'); e.target.value = ''; reload(); }).catch(() => {});
      },
      hasViewer: !!cur,
      viewerDate: cur ? Z().fmtDate(cur.t) : '',
      viewerStyle: cur ? 'flex: 1; border-radius: 22px; background: center / contain no-repeat url(\'' + cur.src + '\')' : '',
      closeViewer: () => i.setState({ zPhoto: null, zDel: false }),
      deleteLabel: i.state.zDel ? 'Toca otra vez para borrarla' : 'Borrar esta foto',
      deleteViewer: () => { if (!i.state.zDel) return i.setState({ zDel: true }); window.ZENDB.remove(cur.id).then(() => { i.setState({ zPhoto: null, zDel: false }); reload(); }); }
    };
  }
};

/* Análisis: tu foto bajo el trazado */
EXT.Analisis = {
  vals(i) {
    const src = Z().get('zenFacePhoto', null);
    return {
      facePhotoBg: src ? "background: center / cover no-repeat url('" + src + "')" : 'background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.12), rgba(255,255,255,0.03))',
      facePhotoText: src ? '' : 'TU FOTO',
      pickCam: () => { if (i.__cam) i.__cam.click(); },
      pickGal: () => { if (i.__gal) i.__gal.click(); },
      setCam: (el) => { i.__cam = el; }, setGal: (el) => { i.__gal = el; },
      onFace: (e) => {
        const f = e.target.files && e.target.files[0]; if (!f) return;
        window.ZENSHRINK(f, 700).then((src) => { Z().set('zenFacePhoto', src); e.target.value = ''; i.forceUpdate(); }).catch(() => {});
      }
    };
  }
};

/* Ajustes: copias, instalación y borrado */
EXT.Ajustes = {
  vals(i) {
    const st = i.state;
    const snap = Z().get('zenBackup', null);
    const fmt = (t) => { try { return new Date(t).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
    const dump = () => { const o = {}; Z().keys().filter((k) => k !== 'zenBackup').forEach((k) => { try { o[k] = localStorage.getItem(k); } catch (e) {} }); return o; };
    const load = (o) => { Object.keys(o).forEach((k) => { if (/^(zen|imagen)/.test(k) && k !== 'zenBackup') try { localStorage.setItem(k, o[k]); } catch (e) {} }); };
    const mode = st.zPanel;
    return {
      lastBackupText: snap ? 'Última copia: ' + fmt(snap.at) + '.' : 'Aún no has hecho ninguna copia.',
      doBackup: () => { Z().set('zenBackup', { at: Date.now(), data: dump() }); i.setState({ zPanel: null, zMsg: '' }); },
      doExport: () => i.setState({ zPanel: 'export', zText: JSON.stringify(dump()), zMsg: '' }),
      doRestore: () => i.setState({ zPanel: 'restore', zText: '', zMsg: '' }),
      panelOpen: !!mode,
      panelTitle: mode === 'export' ? 'Exportar mis datos' : 'Restaurar copia',
      panelHint: mode === 'export' ? 'Copia este texto y guárdalo en tus notas o envíatelo. Incluye notas, progreso, perfil y ajustes (las fotos se quedan en el móvil).' : 'Pega aquí un texto exportado antes, o restaura la última copia guardada en este móvil.',
      panelText: st.zText || '',
      onPanelText: (e) => i.setState({ zText: e.target.value }),
      panelActionLabel: mode === 'export' ? 'Copiar' : 'Restaurar texto pegado',
      panelAction: () => {
        if (mode === 'export') {
          try { navigator.clipboard.writeText(st.zText).then(() => i.setState({ zMsg: 'Copiado.' }), () => i.setState({ zMsg: 'No se pudo copiar: selecciona el texto y cópialo a mano.' })); } catch (e) { i.setState({ zMsg: 'Selecciona el texto y cópialo a mano.' }); }
        } else {
          try { load(JSON.parse(st.zText)); i.setState({ zMsg: 'Restaurado.' }); setTimeout(() => window.ZENGO('Main'), 600); } catch (e) { i.setState({ zMsg: 'Ese texto no es una copia válida.' }); }
        }
      },
      showSnapshot: mode === 'restore' && !!snap,
      snapLabel: snap ? 'Restaurar copia del ' + fmt(snap.at) : '',
      restoreSnapshot: () => { load(snap.data); i.setState({ zMsg: 'Restaurado.' }); setTimeout(() => window.ZENGO('Main'), 600); },
      closePanel: () => i.setState({ zPanel: null, zMsg: '' }),
      panelMsg: st.zMsg || '',
      installOpen: !!st.zInstall, installExpanded: st.zInstall ? 'true' : 'false', installChevron: st.zInstall ? '–' : '+',
      toggleInstall: () => i.setState({ zInstall: !st.zInstall }),
      replayWelcome: () => { Z().del('zenOnboarded'); window.ZENGO('Zen'); },
      wipeLabel: st.zWipe ? 'Toca otra vez para borrarlo todo' : 'Borrar todos mis datos',
      wipeIcon: st.zWipe ? '!' : '›',
      wipe: () => {

<script>
{
const SVGNS = 'http://www.w3.org/2000/svg';
const SRC = JSON.parse(document.getElementById('zen-screens').textContent);
const HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
const FULL = /^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;

/* ---------- storage helpers ---------- */

  today(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); },
  get(k, def) { try { const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  keys() { const out = []; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (/^(zen|imagen)/.test(k)) out.push(k); } } catch (e) {} return out; },
  logs() { return ZEN.get('zenLog', []); },
  log(type, min, what) { const L = ZEN.logs(); L.push({ d: ZEN.today(), t: Date.now(), type, min, what }); ZEN.set('zenLog', L.slice(-600)); },
  week() { const d = new Date(); const dow = (d.getDay() + 6) % 7; const out = []; for (let i = 0; i < 7; i++) { const x = new Date(d); x.setDate(d.getDate() - dow + i); out.push(ZEN.today(x)); } return out; },
  name() { const p = ZEN.get('zenInput:Perfil:pf-n', ''); if (p && p.trim()) return p.trim(); const b = ZEN.get('zenName', ''); return (b || '').trim(); },

};

/* ---------- photos (IndexedDB) ---------- */
let memPhotos = [];
const DB = window.ZENDB = {
  open() { return new Promise((res, rej) => { try { const r = indexedDB.open('zen', 1); r.onupgradeneeded = () => r.result.createObjectStore('fotos', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  tx(mode, fn) { return DB.open().then((db) => new Promise((res) => { const t = db.transaction('fotos', mode); const q = fn(t.objectStore('fotos')); t.oncomplete = () => res(q && q.result); t.onerror = () => res(null); })); },
  all() { return DB.tx('readonly', (s) => s.getAll()).then((r) => (r || []).sort((a, b) => a.t - b.t)).catch(() => memPhotos.slice()); },
  put(o) { return DB.tx('readwrite', (s) => s.put(o)).catch(() => { memPhotos.push(o); }); },
  remove(id) { return DB.tx('readwrite', (s) => s.delete(id)).catch(() => { memPhotos = memPhotos.filter((p) => p.id !== id); }); },
  clear() { return DB.tx('readwrite', (s) => s.clear()).catch(() => { memPhotos = []; }); }
};
const shrink = (file, max) => new Promise((res, rej) => {

window.ZENSHRINK = shrink;
/* ---------- templates ---------- */
const T = {};
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { if (typeof p === 'function') p = p(this.state, this.props); this.state = Object.assign({}, this.state, p); schedule(this); }

}
function loadT(name) {

  const xdc = doc.querySelector('x-dc');
  const helmet = xdc.querySelector(':scope > helmet');
  const roots = [...xdc.childNodes].filter((n) => n !== helmet && !(n.nodeType === 3 && !n.nodeValue.trim()));
  const sc = doc.querySelector('script[data-dc-script]');
  let defaults = {};
  try { const dp = JSON.parse(sc.getAttribute('data-props') || '{}'); for (const k in dp) if (k[0] !== '$' && dp[k] && 'default' in dp[k]) defaults[k] = dp[k].default; } catch (e) {}
  const Comp = new Function('DCLogic', sc.textContent + '\n;return Component;')(DCLogic);

/* ---------- holes ---------- */
function lit(p) {
  if (p === 'true') return [true, true]; if (p === 'false') return [true, false]; if (p === 'null') return [true, null];

function look(path, scope) {

}
const interp = (str, scope) => str.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null ? '' : String(v); });

/* ---------- build ---------- */
let CUR = null;
const camel = (s) => s.replace(/-([a-z])/g, (_, c) => c.toUpperCase());

}
function inputKey(id) {

}

    return [box];
  }

    const h = document.createElement('dc-host'); h.__name = node.getAttribute('name'); h.__props = {};

  }

    const key = inputKey(el.id); el.__pkey = key;
    const saved = ZEN.get(key, null); if (saved != null) el.value = saved;

/* ---------- morph ---------- */
const same = (x, y) => x.nodeType === y.nodeType && (x.nodeType === 3 || (x.namespaceURI === y.namespaceURI && x.localName === y.localName && (x.localName !== 'dc-host' || x.__name === y.__name)));

  if (a.localName === 'dc-host') { a.__props = b.__props; return; }
  syncKids(a, [...b.childNodes]);
}

/* ---------- instances ---------- */
const PERSIST = {
  CuidadoFacial: ['type', 'products', 'tab'], Perfil: ['sel'], Armario: ['order', 'traits', 'have', 'view', 'tab'],
  Peinados: ['chosen', 'ans', 'filter'], Silueta: ['b', 'w', 'h', 'pick'], Colorimetria: ['a'], Gafas: ['shape'], Cejas: ['shape'],
  Espalda: { keys: ['done'], daily: 1 }, Ajustes: ['rem', 'toggles'], Progreso: ['tab', 'view'], Main: { keys: ['energy'], daily: 1 },
  Analisis: ['on'], Historial: ['view', 'zone'], Meditacion: ['sel', 'voice', 'amb'], Bienvenida2: ['name', 'prio']
};
const pcfg = (n) => { const c = PERSIST[n]; return !c ? null : Array.isArray(c) ? { keys: c } : c; };
const helmetsOn = new Set();
function addHelmet(name, t) {
  if (helmetsOn.has(name)) return; helmetsOn.add(name);
  t.helmet.forEach((n) => { const c = document.importNode(n, true); c.setAttribute('data-zen', ''); document.head.appendChild(c); });
}
function create(name, props, host) {

  const inst = new t.Comp(Object.assign({}, t.defaults, props));
  inst.__name = name; inst.__host = host; inst.__kids = [];
  const c = pcfg(name);
  if (c) { const sv = ZEN.get('zenState:' + name, null); if (sv && (!c.daily || sv.__d === ZEN.today())) { const pick = {}; c.keys.forEach((k) => { if (k in sv) pick[k] = sv[k]; }); inst.state = Object.assign({}, inst.state, pick); } }

}

  let vals = inst.renderVals ? inst.renderVals() : {};

  syncKids(inst.__host, kids);

  const hosts = []; const walk = (n) => { for (const c of n.children) { if (c.localName === 'dc-host') hosts.push(c); else walk(c); } }; walk(inst.__host);
  const live = new Set();
  hosts.forEach((h) => {
    const t2 = loadT(h.__name);
    if (!h.__inst) { h.__inst = create(h.__name, h.__props, h); }
    else h.__inst.props = Object.assign({}, t2.defaults, h.__props);
    live.add(h.__inst); render(h.__inst);
  });

  inst.__kids = [...live];
  const refs = (n) => { for (const c of n.children) { if (c.__ref) try { c.__ref(c); } catch (e) {} if (c.localName !== 'dc-host') refs(c); } }; refs(inst.__host);
  const c = pcfg(inst.__name);
  if (c) { const out = c.daily ? { __d: ZEN.today() } : {}; c.keys.forEach((k) => { out[k] = inst.state[k]; }); const js = JSON.stringify(out); if (js !== inst.__saved) { inst.__saved = js; ZEN.set('zenState:' + inst.__name, out); } }

}

  if (pending) return; pending = true;
  queueMicrotask(() => { pending = false; const list = [...dirty]; dirty.clear(); list.forEach((i) => { if (i.__mounted && !i.__dead) render(i); }); });
}

/* ---------- router ---------- */
const NAMES = Object.keys(SRC).filter((n) => n !== 'Nav' && n !== 'MiniTimer');
const byHash = {}; NAMES.forEach((n) => { byHash[n.toLowerCase()] = n; });
const screen = document.getElementById('screen');
let page = null, pageName = null;
function go(name, fromHash) {
  if (!SRC[name] || name === 'Nav' || name === 'MiniTimer') name = 'Main';
  if (name === 'Bienvenida2' && ZEN.get('zenOnboarded', false) && pageName === 'Zen') name = 'Main';
  if (pageName === 'Bienvenida2' && name !== 'Bienvenida2') ZEN.set('zenOnboarded', true);
  if (page) unmount(page);
  document.querySelectorAll('[data-zen]').forEach((n) => n.remove()); helmetsOn.clear();
  try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}

  screen.innerHTML = ''; screen.appendChild(host);
  pageName = name; page = create(name, {}, host); render(page);

}
window.ZENGO = go;
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
  const m = (a.getAttribute('href') || '').match(/^\/?([A-Za-z0-9]+)\.dc\.html/);
  if (m) { e.preventDefault(); go(m[1]); }
});
window.addEventListener('hashchange', () => { const n = byHash[location.hash.slice(1)]; if (n && n !== pageName) go(n, true); });
window.addEventListener('popstate', () => { const n = byHash[location.hash.slice(1)]; if (n && n !== pageName) go(n, true); });

/* ---------- fit to screen ---------- */
function fit() {
  const fr = document.getElementById('frame'); const W = window.innerWidth; const H = (document.body.classList.contains('phone') && fr) ? fr.clientHeight || window.innerHeight : window.innerHeight;
  const phone = W < 620;
  const s = phone ? W / 390 : Math.min(1, (H - 48) / 844);
  const h = phone ? H / s : 844;
  document.documentElement.style.setProperty('--s', s);
  document.documentElement.style.setProperty('--h', h + 'px');
  document.body.classList.toggle('phone', phone);
}
window.addEventListener('resize', fit); fit(); fit();

/* ---------- extensions ---------- */
const EXT = window.ZENEXT || {};
const start = byHash[location.hash.slice(1)] || 'Zen';
go(start === 'Bienvenida2' ? 'Zen' : start, true);
}
